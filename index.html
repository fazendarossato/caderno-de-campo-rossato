<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2C2818" />
<title>Caderno de Campo Digital — Fazenda Rossato</title>
<meta name="description" content="Caderno de campo digital da Fazenda Rossato — Ventania, PR" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #F2ECD7;
    --paper-alt: #E9E0C6;
    --ink: #2C2818;
    --ink-soft: #5C5642;
    --card-white: #FFFDF6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 18px 48px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .readonly-note {
    margin: 6px 0 0;
    font-size: 11.5px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .offline-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--paper-alt);
    color: var(--ink-soft);
  }
  .offline-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4F6237;
  }
  .offline-pill.offline .dot { background: #A34A2E; }

  nav.tabs {
    display: flex;
    gap: 8px;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .tab-btn {
    position: relative;
    cursor: pointer;
    border: 1px solid var(--paper-alt);
    background: var(--card-white);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 16px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 14.5px;
    transition: all .15s ease;
  }
  .tab-btn .ha {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 400;
    font-size: 10.5px;
    opacity: .75;
    margin-top: 2px;
  }
  .tab-btn.active {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
  }
  .tab-btn .novo-badge {
    position: absolute;
    top: -7px; right: -7px;
    background: #A34A2E;
    color: #FFFDF6;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .3px;
    padding: 2px 6px;
    border-radius: 999px;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  .field-summary {
    background: var(--paper-alt);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .field-summary strong {
    color: var(--ink);
    font-family: 'Fraunces', serif;
  }

  .event-card {
    background: var(--card-white);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--paper-alt);
    margin-bottom: 18px;
  }
  .event-header {
    color: #FFFDF6;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .event-header .date {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
  }
  .type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .3px;
    font-weight: 600;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.4);
  }
  .event-note {
    font-size: 12.5px;
    font-style: italic;
    padding: 6px 16px;
    font-family: 'Source Serif 4', serif;
  }
  .event-body { padding: 10px 16px 14px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--paper-alt);
    padding: 6px;
  }
  td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--paper-alt);
    vertical-align: top;
  }
  td.produto { font-family: 'Source Serif 4', serif; font-size: 14px; }
  td.num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    white-space: nowrap;
  }
  td.total { font-weight: 600; }
  .prod-note {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 2px;
  }

  footer {
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
  }

  #install-banner {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--ink);
    color: var(--paper);
    padding: 12px 16px;
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 50;
  }
  #install-banner button {
    background: #B9871F;
    color: #2C2818;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 600;
    font-family: 'Fraunces', serif;
    cursor: pointer;
  }
  #install-banner .close-x {
    background: none;
    color: var(--paper);
    font-size: 16px;
    padding: 0 6px;
  }
</style>

<body>

      <h1>Caderno de Campo Digital</h1>

      <p class="readonly-note">Somente leitura — edições são feitas em conversa com o Claude do projeto.</p>
      <span class="offline-pill" id="netStatus"><span class="dot"></span><span id="netStatusText">Online</span></span>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <section class="field-summary" id="fieldSummary"></section>
    <div id="eventos"></div>

    <footer id="footer"></footer>

  <div id="install-banner">
    <span>Instale este app na tela inicial para acessar offline no campo.</span>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="installBtn">Instalar</button>
      <button class="close-x" id="dismissInstall">✕</button>
    </div>

// Atualizar sempre que os dados de um campo mudarem
const LAST_UPDATE = {
  campo1: { updatedAt: "2026-08-18T13:30:00-03:00", note: "Produto de 15/07 renomeado de \"2,4-D (a confirmar)\" para \"Exemplo\" (marca confirmada)." },
  campo2: { updatedAt: "2026-08-18T13:30:00-03:00", note: "Removido \"Iharol\" da dessecação (não usado neste talhão); adubo do plantio renomeado para \"10-46-00 S9\"." },
  campo3: { updatedAt: "2026-08-18T14:15:00-03:00", note: "Talhão adicionado ao caderno digital; produto \"Elo\" corrigido para \"Echo\" (substituto do Pilarich, mesmo princípio ativo)." },
};

const STORAGE_PREFIX = "rossato_last_viewed:";
let selected = FIELDS[0].id;

function getLastViewed(fieldId) {
  try { return localStorage.getItem(STORAGE_PREFIX + fieldId); }
  catch (e) { return null; }
}
function setLastViewed(fieldId) {
  try { localStorage.setItem(STORAGE_PREFIX + fieldId, new Date().toISOString()); }
  catch (e) { /* silencioso */ }
}
function isNew(fieldId) {
  const u = LAST_UPDATE[fieldId];
  if (!u) return false;
  const viewed = getLastViewed(fieldId);
  if (!viewed) return true;
  return new Date(u.updatedAt) > new Date(viewed);
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  FIELDS.forEach((f) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (f.id === selected ? " active" : "");
    btn.innerHTML = `${f.nome}<span class="ha">${f.area.toFixed(1)} ha</span>` +
      (isNew(f.id) ? `<span class="novo-badge">NOVO</span>` : "");
    btn.onclick = () => {
      selected = f.id;
      setLastViewed(f.id);
      render();
    };
    nav.appendChild(btn);
  });
}

function renderField() {
  const field = FIELDS.find((f) => f.id === selected);
  const summary = document.getElementById("fieldSummary");
  summary.innerHTML = `<strong>${field.nome}</strong> · Área: ${field.area.toFixed(1)} ha · Cultura: ${field.cultura} · Cultivar(es): ${field.cultivares} · ${field.eventos.length} eventos registrados`;

  const container = document.getElementById("eventos");
  container.innerHTML = "";
  field.eventos.forEach((ev) => {
    const style = TYPE_STYLE[ev.tipo] || { accent: "#2C2818", soft: "#E9E0C6" };
    const card = document.createElement("div");
    card.className = "event-card";

    let html = `
      <div class="event-header" style="background:${style.accent}">
        <span class="date">${ev.data}</span>
        <span class="type-badge">${ev.tipo}</span>
      </div>`;
    if (ev.notaEvento) {
      html += `<div class="event-note" style="background:${style.soft}; color:${style.accent}">Obs.: ${ev.notaEvento}</div>`;
    }
    html += `<div class="event-body"><table><thead><tr>
        <th>Produto</th><th>Dose/ha</th><th>Total aplicado</th>
      </tr></thead><tbody>`;
    ev.produtos.forEach((p) => {
      html += `<tr>
          <td class="produto">${p.nome}${p.nota ? `<div class="prod-note">${p.nota}</div>` : ""}</td>
          <td class="num">${p.dose}</td>
          <td class="num total">${p.total}</td>
        </tr>`;
    });
    html += `</tbody></table></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  });

  const footer = document.getElementById("footer");
  const u = LAST_UPDATE[field.id];
  footer.textContent = `Última atualização deste talhão: ${new Date(u.updatedAt).toLocaleString("pt-BR")} — ${u.note}`;
}

function render() {
  renderTabs();
  renderField();
}

setLastViewed(selected);
render();

// --- Indicador online/offline ---
function updateNetStatus() {
  const pill = document.getElementById("netStatus");
  const text = document.getElementById("netStatusText");
  if (navigator.onLine) {
    pill.classList.remove("offline");
    text.textContent = "Online";
  } else {
    pill.classList.add("offline");
    text.textContent = "Offline — mostrando última versão salva";
  }
}
window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);
updateNetStatus();

// --- Registro do Service Worker (para funcionar offline) ---
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// --- Botão de instalação (PWA) ---
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem("rossato_install_dismissed")) {
    document.getElementById("install-banner").style.display = "flex";
  }
});
document.getElementById("installBtn").addEventListener("click", async () => {
  document.getElementById("install-banner").style.display = "none";
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});
document.getElementById("dismissInstall").addEventListener("click", () => {
  document.getElementById("install-banner").style.display = "none";
  try { localStorage.setItem("rossato_install_dismissed", "1"); } catch (e) {}
});
</script>
</body>
</html>
